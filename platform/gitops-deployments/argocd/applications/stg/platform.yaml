apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces-stg
  namespace: argocd
  labels:
    platform.modernkemo/project: platform
    platform.modernkemo/env: stg
  annotations:
    platform.modernkemo/owner: platform-team
spec:
  project: platform-stg
  source:
    repoURL: https://gitlab.internal/platform/gitops-deployments.git
    targetRevision: main
    path: platform/stg
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
