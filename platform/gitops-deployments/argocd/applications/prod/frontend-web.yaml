apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-prod
  namespace: argocd
  labels:
    platform.modernkemo/project: demo
    platform.modernkemo/app: frontend-web
    platform.modernkemo/env: prod
  annotations:
    platform.modernkemo/owner: platform-team
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: demo-frontend-web-prod
  source:
    repoURL: https://gitlab.internal/platform/gitops-deployments.git
    targetRevision: main
    path: apps/demo/frontend-web/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-web-prod
  revisionHistoryLimit: 10
  # 生产禁止自动同步：必须由授权人员在发布窗口内人工 Sync。
  syncPolicy: {}
