apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-stg
  namespace: argocd
  labels:
    platform.modernkemo/project: platform
    platform.modernkemo/env: stg
spec:
  description: "平台资产（stg）：命名空间、配额、限额、网络策略。仅平台组可管理。"
  sourceRepos:
    - "https://gitlab.internal/platform/gitops-deployments.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-stg"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
