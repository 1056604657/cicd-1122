apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-go-api-stg
  namespace: argocd
  labels:
    platform.modernkemo/project: demo
    platform.modernkemo/app: go-api
    platform.modernkemo/env: stg
spec:
  description: "demo / go-api / stg（供应商应用项目）"
  sourceRepos:
    - "https://gitlab.internal/platform/gitops-deployments.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: go-api-stg
  # 供应商项目禁止创建任何集群级资源；Namespace 由平台侧平台应用管理。
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
  orphanedResources:
    warn: true
