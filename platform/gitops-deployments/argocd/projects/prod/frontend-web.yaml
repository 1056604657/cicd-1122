apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-frontend-web-prod
  namespace: argocd
  labels:
    platform.modernkemo/project: demo
    platform.modernkemo/app: frontend-web
    platform.modernkemo/env: prod
spec:
  description: "demo / frontend-web / prod（供应商应用项目）"
  sourceRepos:
    - "https://gitlab.internal/platform/gitops-deployments.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: frontend-web-prod
  # 供应商项目禁止创建任何集群级资源；Namespace 由平台侧平台应用管理。
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
  orphanedResources:
    warn: true
  syncWindows:
    - kind: allow
      schedule: "0 22 * * 2"
      duration: 4h
      timeZone: Asia/Shanghai
      applications:
        - "*"
      manualSync: false
    # 月度结账与重大活动期冻结，示例：每月 28 日起 4 天禁止同步。
    - kind: deny
      schedule: "0 0 28 * *"
      duration: 96h
      timeZone: Asia/Shanghai
      applications:
        - "*"
