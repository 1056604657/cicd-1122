apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-api
        app.kubernetes.io/part-of: demo
    spec:
      # 平台安全基线（与 Pod Security restricted 对齐）：
      # 非 root 运行、禁止提权、丢弃全部 capability、启用默认 seccomp。
      # 供应商的镜像如果确实需要 root，必须走例外申请，不得直接放开。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go-api
          image: host.docker.internal:5500/demo-projects-go-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: base
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
