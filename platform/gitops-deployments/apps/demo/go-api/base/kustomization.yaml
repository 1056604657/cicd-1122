apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base 只包含与环境无关的定义；命名空间、副本数、镜像版本、环境变量
# 一律下沉到 overlays/<env>，避免同一份清单在多环境间被手工改出差异。
resources:
  - deployment.yaml
  - service.yaml

labels:
  # 只有 name 进入 selector：selector 不可变，混入 managed-by 等运维标签会导致后续无法升级。
  - pairs:
      app.kubernetes.io/name: go-api
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: demo
      app.kubernetes.io/managed-by: argocd
