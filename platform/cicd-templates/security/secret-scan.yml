# 密钥泄露扫描：gitleaks 使用内置规则库，不依赖外部数据库，作为提交级硬门禁。
# MR、主干、标签流水线都必须通过，业务项目不得关闭或降级。
secret-scan:
  stage: security
  interruptible: true
  image:
    name: zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - gitleaks detect --source . --no-banner --redact
        --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days
