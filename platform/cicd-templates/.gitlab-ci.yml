# 模板仓库自己的门禁。
#
# 这个仓库原来没有流水线，但项目开着"流水线成功才允许合并"——结果是 MR 永远
# 没有"成功"的那一天，模板改动根本合不进去。更糟的是它最该走 MR：这里的错误
# 不是"这个仓库红一下"，而是所有业务项目的流水线同时 config error。
#
# 两道检查：
#   1. templates-check —— 静态自检（stage 是否声明、镜像是否按 digest 固定、
#      README 的 include 清单是否与仓库文件一致）
#   2. secret-scan —— 模板里会贴示例地址与变量样例，容易把真实凭据带进来
default:
  tags: [docker-general]

stages:
  - validate
  - security

templates-check:
  stage: validate
  interruptible: true
  image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    # 脚本只用标准库 + PyYAML，装依赖要联网，所以 PyYAML 是唯一需要预装的
    - pip install --no-cache-dir pyyaml >/dev/null
    - python3 tools/check_templates.py

secret-scan:
  stage: security
  interruptible: true
  image:
    name: zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - gitleaks detect --source . --no-banner --redact
        --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days
