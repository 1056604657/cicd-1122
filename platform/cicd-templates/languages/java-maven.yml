java-maven-build:
  stage: build
  interruptible: true
  image: maven:3.9.6-eclipse-temurin-21@sha256:8d63d4c1902cb12d9e79a70671b18ebe26358cb592561af33ca1808f00d935cb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mvn -B -DskipTests package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

java-maven-test:
  stage: validate
  interruptible: true
  image: maven:3.9.6-eclipse-temurin-21@sha256:8d63d4c1902cb12d9e79a70671b18ebe26358cb592561af33ca1808f00d935cb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mvn -B test
  artifacts:
    reports:
      junit: target/surefire-reports/*.xml
    # 覆盖率报告必须交给 quality 阶段的 coverage-gate，否则门禁判"没找到报告"即失败。
    # 由项目的 jacoco-maven-plugin 产出（pom.xml 里配）。
    paths:
      - target/site/jacoco/jacoco.xml
    expire_in: 1 week
