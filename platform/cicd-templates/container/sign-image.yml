# 镜像签名：cosign keyless 需要 OIDC 与透明日志，内网环境应改用私钥模式（COSIGN_KEY）。
# 当前作为手动作业，待密钥管理系统就绪后转为自动并纳入发布门禁。
sign-image:
  stage: image-security
  interruptible: false
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  # 同上：不对 build-image 使用 needs，避免 tag 流水线 config error。
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - apk add --no-cache curl >/dev/null
  script:
    - echo "待接入密钥管理后启用签名：$REGISTRY_HOST/$IMAGE_NAME@$(cat .image-digest)"
