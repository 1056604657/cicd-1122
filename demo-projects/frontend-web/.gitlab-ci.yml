# 标准流水线接入文件。整份文件只有两件事：引用平台模板、声明本项目标识。
# 不在这里写机房地址——GitLab 的变量优先级是「组变量 > 本文件变量」，
# REGISTRY_HOST 等共享值由平台配置，晋级触发令牌按业务项目配置。
include:
  - project: platform/cicd-templates
    ref: v1.0.19
    file:
      - /languages/node.yml
      - /defaults.yml
      - /workflow.yml
      - /stages.yml
      - /security/secret-scan.yml
      - /security/sast.yml
      - /security/sca.yml
      - /security/license-scan.yml
      - /security/iac-scan.yml
      - /quality/lint.yml
      - /quality/coverage-gate.yml
      - /container/build-image.yml
      - /container/scan-image.yml
      - /container/sbom.yml
      - /container/sign-image.yml
      - /gitops/stg-promotion.yml
      - /gitops/release-candidate.yml
      - /gitops/prod-promotion.yml
      - /security/sonarqube.yml
      - /security/dast.yml

variables:
  # ---- 项目标识：每个项目唯一需要维护的三行 ----
  PROJECT_KEY: "demo"
  APP_NAME: "frontend-web"
  K8S_NAMESPACE: "frontend-web-stg"

  # 说明：MIN_COVERAGE 不能写在文件里。job 级变量优先于全局变量，
  # 模板在 coverage-gate 作业里设了 60，会盖掉这里的值。
  # 要按项目调阈值，用「项目级 CI/CD 变量」（设置 → CI/CD → 变量）。

# ---------------------------------------------------------------------------
# demo 占位段：以下作业在 demo 里用一行 echo 显示通过，job 本身照样存在、状态为 success。
#
# 占位的两类原因：
#   1. 依赖外部服务：sonarqube（要 SonarQube）、dast-baseline（要已部署 STG）、sign-image（要 KMS 私钥）。
#   2. 依赖公网漏洞库：dependency-scan / image-scan / sbom 三个 Trivy 作业每次要下 136MB 库，
#      demo 环境网络不稳会长时间卡住；它们只影响展示，不影响晋级所需的镜像 digest。
#
# 为什么可以这样占位：甲方 promote.py 只校验这些 job 的状态为 success，再用 build-image 的
# artifact（image.env 里的 digest）写 STG overlay——占位作业不参与那条可信链。
# 真实项目接入时删除本段，模板里的真作业自动生效，不需要改其它地方。
# 仍然真跑的门禁：secret-scan、sast、覆盖率、license-scan/gate、dockerfile-policy、build-image。
sonarqube:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "【demo 占位】SonarQube 未接入，本作业不执行真实扫描，按通过处理"
    - echo "  接入方式：设置 SONAR_HOST_URL 与 SONAR_TOKEN，删掉 .gitlab-ci.yml 末尾的占位段"

dast-baseline:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  script:
    - echo "【demo 占位】STG 未部署，本作业不执行真实 DAST，按通过处理"
    - echo "  接入方式：Argo CD 把 STG 跑起来后设置 DAST_TARGET_URL，删掉占位段"

sign-image:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "【demo 占位】镜像签名需要 KMS/Vault 里的私钥，demo 未接入，按通过处理"
    - echo "  接入方式：配好 cosign 私钥后删掉本段，平台还需实现签名及验签"


# --- demo 占位：三个 Trivy 漏洞扫描作业（真实项目删除本段）---
dependency-scan:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "【demo 占位】dependency-scan 未执行真实 Trivy 依赖漏洞扫描，按通过处理"
    - echo '{"Results":[]}' > trivy-fs-report.json

image-scan:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "【demo 占位】image-scan 未执行真实 Trivy 镜像漏洞扫描，按通过处理"
    - echo '{"Results":[]}' > trivy-image-report.json

sbom:
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "【demo 占位】sbom 未生成真实 CycloneDX 清单，按通过处理"
    - echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom.json
